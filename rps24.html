<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piedra Papel Tijera XL</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:#14121f;color:#f3f0ff;font-family:system-ui,sans-serif;text-align:center}
h1{margin:14px 0 4px;font-size:1.5rem}
.score{display:flex;justify-content:center;gap:20px;margin:8px;font-size:1.1rem}
.arena{display:flex;justify-content:center;align-items:center;gap:16px;margin:12px;min-height:130px}
.pick{background:#221f36;border-radius:16px;padding:10px;min-width:110px;font-size:3rem}
.pick svg{width:80px;height:80px;display:block;margin:auto}
.pick small{display:block;font-size:.8rem}
#msg{font-weight:700;min-height:26px;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:10px;max-width:760px;margin:auto}
button{background:#2b2748;color:inherit;border:0;border-radius:12px;padding:8px 4px;cursor:pointer}
button svg{width:48px;height:48px;display:block;margin:auto}
button small{display:block;font-size:.68rem;margin-top:2px}
button:hover{background:#4b3fa8;transform:scale(1.06)}
.pop{animation:pop .35s}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#hist{max-width:560px;margin:10px auto;text-align:left;font-size:.85rem;padding:0 14px;list-style:none}
</style></head><body>
<h1>Piedra Papel Tijera XL</h1>
<div class="score"><span>Tú: <b id="w">0</b></span><span>Empates: <b id="t">0</b></span><span>PC: <b id="l">0</b></span></div>
<div class="arena"><div class="pick" id="me">?<small>Tú</small></div><b>VS</b><div class="pick" id="cpu">?<small>PC</small></div></div>
<div id="msg">Elige tu personaje</div>
<div class="grid" id="grid"></div>
<ul id="hist"></ul>
<script>
const SK="#f1c27d";
const eyes=(y=29)=>`<circle cx="25" cy="${y}" r="2.5"/><circle cx="39" cy="${y}" r="2.5"/>`;
// [nombre, dibujo SVG]. Orden en círculo: cada uno vence a los 11 siguientes y empata con el opuesto (+12).
const E=[
["Piedra",`<path d="M8 48L14 26L32 14L52 22L58 42L46 54H18Z" fill="#8a8f98"/><path d="M20 32L34 24L46 34" stroke="#5c6068" fill="none" stroke-width="2.5"/>`],
["Hermano",`<circle cx="32" cy="34" r="20" fill="${SK}"/>${eyes(33)}<path d="M23 44Q32 52 41 44" stroke="#000" fill="none" stroke-width="2.5"/><path d="M11 32Q12 8 32 8Q52 8 53 32Q44 20 32 20Q20 20 11 32Z" fill="#4a2c17"/>`],
["Tanque",`<rect x="6" y="40" width="52" height="15" rx="7" fill="#37474f"/><rect x="12" y="28" width="36" height="14" rx="3" fill="#5b7a3a"/><rect x="24" y="19" width="18" height="11" rx="2" fill="#6f9146"/><rect x="40" y="22" width="22" height="5" fill="#3f5a28"/>`],
["Creeper",`<rect x="8" y="8" width="48" height="48" fill="#4caf50"/><rect x="16" y="18" width="12" height="12" fill="#111"/><rect x="36" y="18" width="12" height="12" fill="#111"/><rect x="26" y="30" width="12" height="10" fill="#111"/><rect x="20" y="38" width="8" height="12" fill="#111"/><rect x="36" y="38" width="8" height="12" fill="#111"/>`],
["Führer",`<circle cx="32" cy="34" r="20" fill="#f5d7b5"/><path d="M12 30Q14 10 34 10Q52 12 52 26Q40 16 24 22Q18 24 12 30Z" fill="#212121"/>${eyes(33)}<rect x="26" y="39" width="12" height="5" fill="#212121"/><path d="M27 48h10" stroke="#8d4a3a" stroke-width="2.5"/>`],
["Unabomber",`<path d="M8 58Q8 8 32 8Q56 8 56 58Z" fill="#546e7a"/><circle cx="32" cy="36" r="14" fill="${SK}"/><rect x="18" y="31" width="12" height="7" rx="2"/><rect x="34" y="31" width="12" height="7" rx="2"/><path d="M26 45h12" stroke="#000" stroke-width="2.5"/>`],
["Ninja",`<circle cx="32" cy="34" r="22" fill="#212121"/><rect x="12" y="28" width="40" height="11" rx="5" fill="${SK}"/>${eyes(33)}<rect x="10" y="20" width="44" height="6" fill="#d32f2f"/>`],
["Tung Tung Sahur",`<rect x="18" y="6" width="26" height="52" rx="11" fill="#a0693a"/><circle cx="26" cy="24" r="5" fill="#fff"/><circle cx="37" cy="24" r="5" fill="#fff"/><circle cx="26" cy="24" r="2"/><circle cx="37" cy="24" r="2"/><rect x="24" y="34" width="14" height="8" rx="3" fill="#4e2a10"/><rect x="46" y="22" width="9" height="34" rx="4" fill="#7b4a22" transform="rotate(18 50 40)"/>`],
["Tijera",`<path d="M32 34L14 6M32 34L50 6" stroke="#cfd8dc" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="50" r="9" fill="none" stroke="#e53935" stroke-width="5"/><circle cx="44" cy="50" r="9" fill="none" stroke="#e53935" stroke-width="5"/><path d="M32 34L22 44M32 34L42 44" stroke="#cfd8dc" stroke-width="5"/>`],
["Pato con sombrero",`<ellipse cx="32" cy="42" rx="20" ry="14" fill="#fdd835"/><circle cx="40" cy="26" r="12" fill="#fdd835"/><path d="M48 26h12l-3 6h-9Z" fill="#fb8c00"/><circle cx="42" cy="23" r="2"/><path d="M26 16h28M32 16Q34 4 44 4Q52 4 50 16Z" fill="#6d4c2c" stroke="#6d4c2c" stroke-width="3"/>`],
["Pablo Escobar",`<path d="M22 16Q32 6 42 16L38 25Q54 34 50 48Q48 58 32 58Q16 58 14 48Q10 34 26 25Z" fill="#6d8f3a"/><rect x="22" y="14" width="20" height="5" rx="2" fill="#a1887f"/><text x="32" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">$</text>`],
["CIA",`<rect x="6" y="16" width="52" height="32" rx="7" fill="#1a237e"/><circle cx="32" cy="32" r="8" fill="none" stroke="#fff" stroke-width="2"/><text x="32" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#9fa8da">CIA</text>`],
["Ogro verde",`<circle cx="32" cy="34" r="22" fill="#9ccc65"/><path d="M8 26L14 34L16 22ZM56 26L50 34L48 22Z" fill="#7cb342"/><circle cx="24" cy="30" r="4" fill="#fff"/><circle cx="40" cy="30" r="4" fill="#fff"/><circle cx="24" cy="30" r="2"/><circle cx="40" cy="30" r="2"/><path d="M22 44Q32 52 42 44" stroke="#33691e" fill="none" stroke-width="3"/>`],
["Gallina",`<ellipse cx="30" cy="40" rx="20" ry="16" fill="#fafafa"/><circle cx="42" cy="22" r="10" fill="#fafafa"/><path d="M38 12Q42 6 46 12" fill="#e53935" stroke="#e53935" stroke-width="4"/><path d="M50 22h9l-6 5Z" fill="#fb8c00"/><circle cx="44" cy="20" r="2"/><path d="M26 54v6M34 54v6" stroke="#fb8c00" stroke-width="3"/>`],
["Tralalero Tralala",`<path d="M4 40Q28 8 60 34Q40 54 4 40Z" fill="#78909c"/><path d="M28 20L36 6L40 24Z" fill="#546e7a"/><circle cx="46" cy="30" r="3" fill="#fff"/><circle cx="46" cy="30" r="1.5"/><rect x="18" y="46" width="12" height="8" rx="3" fill="#e53935"/><rect x="34" y="46" width="12" height="8" rx="3" fill="#e53935"/>`],
["WiFi",`<path d="M6 26Q32 2 58 26M15 35Q32 20 49 35M24 44Q32 36 40 44" stroke="#29b6f6" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="32" cy="53" r="4" fill="#29b6f6"/>`],
["Papel",`<path d="M12 6h28l12 12v40H12Z" fill="#fafafa"/><path d="M40 6v12h12" fill="#cfd8dc"/><path d="M19 30h26M19 38h26M19 46h16" stroke="#90a4ae" stroke-width="2.5"/>`],
["Bombardiro Crocodilo",`<ellipse cx="30" cy="34" rx="26" ry="9" fill="#558b2f"/><path d="M26 34L12 8L36 30ZM26 36L12 60L36 38Z" fill="#33691e"/><path d="M54 32h8v5h-8Z" fill="#7cb342"/><path d="M54 37l2 3 2-3 2 3" stroke="#fff" fill="none"/><circle cx="48" cy="30" r="3" fill="#fff"/><circle cx="48" cy="30" r="1.5"/>`],
["Avión",`<path d="M26 30L16 6h9L42 30ZM26 38L16 60h9L42 38Z" fill="#78909c"/><ellipse cx="32" cy="34" rx="28" ry="6" fill="#eceff1"/><path d="M8 34L3 22h7l7 12Z" fill="#b0bec5"/>`],
["Dragón",`<path d="M8 56Q8 20 32 20Q56 20 56 56Z" fill="#e53935"/><path d="M16 26L10 6L26 20ZM48 26L54 6L38 20Z" fill="#ffcc80"/><circle cx="24" cy="36" r="4" fill="#ffee58"/><circle cx="40" cy="36" r="4" fill="#ffee58"/><circle cx="28" cy="48" r="2"/><circle cx="36" cy="48" r="2"/>`],
["Dinosaurios",`<path d="M6 54Q8 32 28 28L32 12H54V26L44 30L52 54H40L36 44L26 54Z" fill="#43a047"/><circle cx="44" cy="19" r="2.5" fill="#fff"/><path d="M40 27h10" stroke="#fff" stroke-width="2"/>`],
["Meteorito",`<path d="M34 36L4 6L28 18L8 24L30 30Z" fill="#ff7043"/><circle cx="42" cy="42" r="16" fill="#6d4c41"/><circle cx="38" cy="38" r="3" fill="#4e342e"/><circle cx="47" cy="47" r="4" fill="#4e342e"/>`],
["Agujero negro",`<ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="#ff9800" stroke-width="5" transform="rotate(-20 32 32)"/><circle cx="32" cy="32" r="14" fill="#000" stroke="#7e57c2" stroke-width="2"/>`],
["Thanos",`<path d="M12 20Q32 2 52 20L48 46Q32 62 16 46Z" fill="#9c6ade"/><path d="M20 30h8M36 30h8" stroke="#212121" stroke-width="3"/><path d="M22 42Q32 52 42 42" stroke="#4a2b7a" fill="none" stroke-width="3"/><path d="M14 22Q20 34 18 40M50 22Q44 34 46 40" stroke="#7b4fc0" fill="none" stroke-width="2"/>`]
];
const N=E.length;let s={w:0,t:0,l:0};
const $=id=>document.getElementById(id);
const ic=i=>`<svg viewBox="0 0 64 64">${E[i][1]}</svg>`;
E.forEach((e,i)=>{const b=document.createElement("button");b.innerHTML=ic(i)+"<small>"+e[0]+"</small>";b.onclick=()=>play(i);$("grid").appendChild(b)});
function play(i){
 const c=Math.floor(Math.random()*N),d=(c-i+N)%N;
 let r,m;
 if(d===0||d===12){r="t";m="Empate"}
 else if(d<12){r="w";m="¡Ganaste! 🎉"}
 else{r="l";m="Perdiste 😭"}
 s[r]++;
 for(const k in s)$(k).textContent=s[k];
 [["me",i],["cpu",c]].forEach(([id,x])=>{const el=$(id);el.innerHTML=ic(x)+"<small>"+E[x][0]+"</small>";el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")});
 $("msg").textContent=m;
 const li=document.createElement("li");li.textContent=E[i][0]+" vs "+E[c][0]+" → "+m;
 $("hist").prepend(li);if($("hist").children.length>8)$("hist").lastChild.remove();
}
</script></body></html>
